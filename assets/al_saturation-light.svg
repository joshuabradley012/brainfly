    </style><rect width="1120" height="470" fill="#ffffff"/><text x="24.0" y="30.0" class="lab" text-anchor="start">The slow receptor component kept the projection neurons from saturating; measured, it doesn't, and 4-methylcyclohexanol still trails</text><text x="24.0" y="50.0" class="note" text-anchor="start">Left: DL5's fast current is flat above 20 spikes/s of input; its slow current grows with the input (experiments/odor_drive_check.py). Middle: with the slow component</text><text x="24.0" y="68.0" class="note" text-anchor="start">depressing as Nagel et al. measured it, the transform saturates as flies' does, at three quarters of their size. Right: the model barely raises 4-methylcyclohexanol.</text><text x="70.0" y="108.0" class="val" text-anchor="start">DL5's synaptic currents, last 300 ms</text><text x="87.1" y="385.0" class="tick" text-anchor="middle">5</text><text x="140.3" y="385.0" class="tick" text-anchor="middle">10</text><text x="193.4" y="385.0" class="tick" text-anchor="middle">20</text><text x="263.7" y="385.0" class="tick" text-anchor="middle">50</text><text x="316.8" y="385.0" class="tick" text-anchor="middle">100</text><text x="370.0" y="385.0" class="tick" text-anchor="middle">200</text><text x="220.0" y="402.0" class="tick" text-anchor="middle">receptor neurons' rise (spikes/s)</text><line x1="70" y1="370.0" x2="370" y2="370.0" stroke="#d1d9e0" stroke-opacity="1"/><text x="62.0" y="374.0" class="tick" text-anchor="end">0</text><line x1="70" y1="286.7" x2="370" y2="286.7" stroke="#d1d9e0" stroke-opacity="0.5"/><text x="62.0" y="290.7" class="tick" text-anchor="end">20</text><line x1="70" y1="203.3" x2="370" y2="203.3" stroke="#d1d9e0" stroke-opacity="0.5"/><text x="62.0" y="207.3" class="tick" text-anchor="end">40</text><line x1="70" y1="120.0" x2="370" y2="120.0" stroke="#d1d9e0" stroke-opacity="0.5"/><text x="62.0" y="124.0" class="tick" text-anchor="end">60</text><path d="M140.3 205.8 L193.4 181.9 L246.6 168.2 L299.7 169.0 L352.9 171.6" fill=