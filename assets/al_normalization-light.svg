    </style><rect width="1120" height="520" fill="#ffffff"/><text x="24.0" y="30.0" class="lab" text-anchor="start">The antennal lobe's inhibition against an odor's strength</text><text x="24.0" y="50.0" class="note" text-anchor="start">Each dot an odor: its presynaptic divisor's excess over 1 against its summed receptor input. Flies' normalization grows as the line (Olsen et al. 2010);</text><text x="24.0" y="68.0" class="note" text-anchor="start">the model's linear inhibition grew about half as steeply (grey, slope 0.64), so weak odors lost too much; squared, it comes close (red, slope 1.04; the line's 1.20).</text><line x1="110.0" y1="110" x2="110.0" y2="440" stroke="#d1d9e0" stroke-opacity="0.5"/><text x="110.0" y="458.0" class="tick" text-anchor="middle">300</text><line x1="305.6" y1="110" x2="305.6" y2="440" stroke="#d1d9e0" stroke-opacity="0.5"/><text x="305.6" y="458.0" class="tick" text-anchor="middle">500</text><line x1="434.5" y1="110" x2="434.5" y2="440" stroke="#d1d9e0" stroke-opacity="0.5"/><text x="434.5" y="458.0" class="tick" text-anchor="middle">700</text><line x1="571.1" y1="110" x2="571.1" y2="440" stroke="#d1d9e0" stroke-opacity="0.5"/><text x="571.1" y="458.0" class="tick" text-anchor="middle">1000</text><line x1="700.0" y1="110" x2="700.0" y2="440" stroke="#d1d9e0" stroke-opacity="0.5"/><text x="700.0" y="458.0" class="tick" text-anchor="middle">1400</text><line x1="110" y1="440.0" x2="700" y2="440.0" stroke="#d1d9e0" stroke-opacity="0.5"/><text x="102.0" y="444.0" class="tick" text-anchor="end">0.25</text><line x1="110" y1="340.7" x2="700" y2="340.7" stroke="#d1d9e0" stroke-opacity="0.5"/><text x="102.0" y="344.7" class="tick" text-anchor="end">0.5</text><line x1="110" y1="241.3" x2="700" y2="241.3" stroke="#d1d9e0" stroke-opacity="0.5"/><text x="102.0" y="245.3" class="tick" text-anchor="end">1</text><line x1="110" y1="142.0" x2="700" y2="142.0" stroke="#d1d9e0" stroke-opacity="0.5"/><text x="102.0" y="146.0" class="tick" text-anchor="end">2