    </style><rect width="1120" height="540" fill="#ffffff"/><text x="24.0" y="30.0" class="lab" text-anchor="start">The measured slow component makes the projection neurons accommodate; keeping their current makes them open hard</text><text x="24.0" y="50.0" class="note" text-anchor="start">The antennal lobe with its local neurons calibrated (odor_probe42.py), the receptor synapse's slow component at Nagel et al.'s 0.774 (grey) or Kazama &amp; Wilson's 0.086 (red),</text><text x="24.0" y="68.0" class="note" text-anchor="start">and the projection neurons losing their synaptic current at each spike (dashed) or keeping it (solid; odor_probe41.py). Right: one dot per odor; shaded: flies (Turner et al. 2008).</text><text x="86.0" y="106.0" class="val" text-anchor="start">3-octanol's projection neurons</text><line x1="86" y1="440.0" x2="646" y2="440.0" stroke="#d1d9e0" stroke-opacity="1"/><text x="78.0" y="444.0" class="tick" text-anchor="end">0</text><line x1="86" y1="394.3" x2="646" y2="394.3" stroke="#d1d9e0" stroke-opacity="0.5"/><text x="78.0" y="398.3" class="tick" text-anchor="end">20</text><line x1="86" y1="348.6" x2="646" y2="348.6" stroke="#d1d9e0" stroke-opacity="0.5"/><text x="78.0" y="352.6" class="tick" text-anchor="end">40</text><line x1="86" y1="302.9" x2="646" y2="302.9" stroke="#d1d9e0" stroke-opacity="0.5"/><text x="78.0" y="306.9" class="tick" text-anchor="end">60</text><line x1="86" y1="257.1" x2="646" y2="257.1" stroke="#d1d9e0" stroke-opacity="0.5"/><text x="78.0" y="261.1" class="tick" text-anchor="end">80</text><line x1="86" y1="211.4" x2="646" y2="211.4" stroke="#d1d9e0" stroke-opacity="0.5"/><text x="78.0" y="215.4" class="tick" text-anchor="end">100</text><line x1="86" y1="165.7" x2="646" y2="165.7" stroke="#d1d9e0" stroke-opacity="0.5"/><text x="78.0" y="169.7" class="tick" text-anchor="end">120</text><line x1="86" y1="120.0" x2="646" y2="120.0" stroke="#d1d9e0" stroke-opacity="0.5"/><text x="78.0" y="124.0" class="tick" text-anchor="end">140<