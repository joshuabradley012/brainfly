    </style><rect width="1120" height="600" fill="#0d1117"/><text x="24.0" y="30.0" class="lab" text-anchor="start">A rotating drum drives the brain's yaw neck motor neurons on the side whose HS cells it excites</text><text x="24.0" y="50.0" class="note" text-anchor="start">Rung 6's whole brain with its eyes, open loop (8 flies). Counterclockwise drives the left HS cells, DNp15 and yaw motor neurons; clockwise</text><text x="24.0" y="68.0" class="note" text-anchor="start">the right ones. The pitch motor neuron CvN7 stays near rest; CvN6 follows the opposite side's HSS input. Filled: left cells; open: right.</text><text x="485.0" y="100.0" class="val" text-anchor="middle">Counterclockwise (front-to-back on the left eye)</text><line x1="300.0" y1="116" x2="300.0" y2="474" stroke="#3d444d" stroke-width="1"/><text x="300.0" y="490.0" class="tiny" text-anchor="middle">0</text><line x1="415.6" y1="116" x2="415.6" y2="474" stroke="#3d444d" stroke-width="1"/><text x="415.6" y="490.0" class="tiny" text-anchor="middle">50</text><line x1="531.2" y1="116" x2="531.2" y2="474" stroke="#3d444d" stroke-width="1"/><text x="531.2" y="490.0" class="tiny" text-anchor="middle">100</text><line x1="646.9" y1="116" x2="646.9" y2="474" stroke="#3d444d" stroke-width="1"/><text x="646.9" y="490.0" class="tiny" text-anchor="middle">150</text><text x="485.0" y="506.0" class="tiny" text-anchor="middle">spikes/s</text><text x="24.0" y="137.0" class="val" text-anchor="start">Motion cells</text><text x="36.0" y="159.0" class="tick" text-anchor="start">HS (HSN, HSE, HSS)</text><line x1="303.6" y1="150.0" x2="303.6" y2="160.0" stroke="#6e7681" stroke-width="2"/><line x1="305.3" y1="150.0" x2="305.3" y2="160.0" stroke="#6e7681" stroke-width="2"/><line x1="453.5" y1="155.0" x2="300.0" y2="155.0" stroke="#9198a1" stroke-width="1.5"/><circle cx="453.5" cy="155.0" r="5.5" fill="#e6edf3"><title>HS (HSN, HSE, HSS) left: 66.4 Hz</title></circle><circle cx="300.0" cy="155.0" r="5.5" fill="#0d1117" stroke="#e5