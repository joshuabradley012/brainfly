    </style><rect width="960" height="470" fill="#0d1117"/><text x="24.0" y="34.0" class="lab" text-anchor="start">Odors reach the mushroom body, but MBON11 hears them faintly</text><text x="24.0" y="54.0" class="note" text-anchor="start">Measured properties added in turn (rows 2-4), and one variant (row 5); six odors per row (dot: mean, line: range across odors)</text><text x="250.0" y="96.0" class="val" text-anchor="start">Kenyon cells responding (Turner's criterion)</text><rect x="254.5" y="130" width="45.0" height="230" fill="#e5533f" fill-opacity="0.25"/><text x="303.5" y="126.0" class="tick" text-anchor="start">flies</text><line x1="250.0" y1="360" x2="250.0" y2="366" stroke="#3d444d"/><text x="250.0" y="382.0" class="tick" text-anchor="middle">0</text><line x1="340.0" y1="360" x2="340.0" y2="366" stroke="#3d444d"/><text x="340.0" y="382.0" class="tick" text-anchor="middle">20</text><line x1="430.0" y1="360" x2="430.0" y2="366" stroke="#3d444d"/><text x="430.0" y="382.0" class="tick" text-anchor="middle">40</text><line x1="520.0" y1="360" x2="520.0" y2="366" stroke="#3d444d"/><text x="520.0" y="382.0" class="tick" text-anchor="middle">60</text><text x="385.0" y="400.0" class="tick" text-anchor="middle">% of 4,064 Kenyon cells</text><line x1="250" y1="150.0" x2="520" y2="150.0" stroke="#3d444d" stroke-opacity="0.5"/><line x1="345.4" y1="150.0" x2="407.2" y2="150.0" stroke="#6e7681" stroke-width="2.5" stroke-linecap="round"/><circle cx="383.6" cy="150.0" r="5" fill="#6e7681" stroke="#0d1117" stroke-width="2"/><text x="238.0" y="154.0" class="tick" text-anchor="end">rung 4's brain</text><text x="415.2" y="154.0" class="tick" text-anchor="start">21–35</text><line x1="250" y1="196.0" x2="520" y2="196.0" stroke="#3d444d" stroke-opacity="0.5"/><line x1="394.4" y1="196.0" x2="481.5" y2="196.0" stroke="#6e7681" stroke-width="2.5" stroke-linecap="round"/><circle cx="448.4" cy="196.0" r="5" fill="#6e7681" stroke="#0d1117" stroke-width="2"/><text x="238.0" y="200.0" class