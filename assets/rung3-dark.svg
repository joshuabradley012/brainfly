<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="400" viewBox="0 0 1120 400" role="img" aria-labelledby="t"><title id="t">Rung 3: flyvis's model 001 fine-tuned with rung 3's direction test and polarities in its loss. T5a, which weakly preferred up, now prefers front to back in the eye, though with a smaller response; 31 of 32 polarities are right; and a loom on the left still drives the loomed side's LC4 and LPLC2 to peaks of 26 and 26 Hz and the giant fiber to 44 Hz</title><style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .lab { font-size: 16px; font-weight: 600; fill: #e6edf3; }
    .val { font-size: 13px; font-weight: 600; fill: #e6edf3; }
