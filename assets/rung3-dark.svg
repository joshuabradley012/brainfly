    .tick { font-size: 11px; fill: #9198a1; }
    </style><rect width="1120" height="400" fill="#0d1117"/><text x="24.0" y="34.0" class="lab" text-anchor="start">Rung 3 passes on fitted criteria: an eye whose T2 answers darkening, with flies' polarities</text><text x="24.0" y="54.0" class="note" text-anchor="start">flyvis's model 001 (grey) and the same model fine-tuned with rung 3's direction test and the known polarities in its loss (red), on a fresh seed</text><text x="24.0" y="96.0" class="val" text-anchor="start">T5a in the eye, dark edges moving each way</text><rect x="56.0" y="137.1" width="16" height="162.9" fill="#4a525c"/><rect x="136.0" y="138.9" width="16" height="161.1" fill="#4a525c"/><rect x="216.0" y="120.0" width="16" height="180.0" fill="#4a525c"/><rect x="296.0" y="143.1" width="16" height="156.9" fill="#4a525c"/><rect x="74.0" y="236.6" width="16" height="63.4" fill="#e5533f"/><rect x="154.0" y="258.9" width="16" height="41.1" fill="#e5533f"/><rect x="234.0" y="249.4" width="16" height="50.6" fill="#e5533f"/><rect x="314.0" y="290.6" width="16" height="9.4" fill="#e5533f"/><line x1="56" y1="300" x2="346" y2="300" stroke="#3d444d"/><text x="73.0" y="316.0" class="tick" text-anchor="middle">front to back</text><text x="153.0" y="316.0" class="tick" text-anchor="middle">back to front</text><text x="233.0" y="316.0" class="tick" text-anchor="middle">up</text><text x="313.0" y="316.0" class="tick" text-anchor="middle">down</text><text x="24.0" y="340.0" class="tick" text-anchor="start">model 001 prefers up (DSI 0.07): wrong</text><text x="24.0" y="356.0" class="tick" text-anchor="start">fine-tuned prefers front to back (DSI 0.21), as T5a does,</text><text x="24.0" y="372.0" class="tick" text-anchor="start">but at 0.4 of model 001's response; all 16 subtypes right</text><text x="400.0" y="96.0" class="val" text-anchor="start">Polarity index, signed so that right is positive</text><rect x="521.0" y="110.0" width="169.0" height="143.0" fill="#e5533f" fill-opacity="0.06"/><line x1="521.0" y1="110" x2