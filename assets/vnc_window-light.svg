<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="t"><title id="t">Rung 5's nerve cord model holds a walking rhythm only while DNg100 fires 10-20 spikes/s, and DNg97 barely speeds it</title><style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .lab { font-size: 16px; font-weight: 600; fill: #1f2328; }
    .val { font-size: 13px; font-weight: 600; fill: #1f2328; }
    .note { font-size: 13px; fill: #59636e; }
    .tick { font-size: 11px; fill: #59636e; }
    .tiny { font-size: 10px; fill: #59636e; }
    </style><rect width="1120" height="560" fill="#ffffff"/><text x="24.0" y="30.0" class="lab" text-anchor="start">Rung 5's nerve cord: a walking rhythm only in a narrow window</text><text x="24.0" y="50.0" class="note" text-anchor="start">DNg100 drives front-leg rhythms only while it fires about 10-20 spikes/s; faster, the network runs away and silences it. Walking descending neurons in flies fire about 20-60.</text><text x="24.0" y="68.0" class="note" text-anchor="start">Adding DNg97, which speeds headless flies' stepping by about half, speeds the model's rhythm by at most 16%, and the rhythm falls apart.</text><rect x="292.2" y="118" width="317.8" height="350" fill="#1f2328" fill-opacity="0.06"><title>DNg100 at 20 spikes/s or more, where walking descending neurons recorded in flies fire</title></rect><text x="604.0" y="132.0" class="tick" text-anchor="end">flies' walking DN rates (20+ spikes/s)</text><text x="90.0" y="92.0" class="val" text-anchor="start">replicates with a front-leg rhythm, of 16</text><text x="610.0" y="92.0" class="tiny" text-anchor="end">numbers: the right DNg100's own rate (spikes/s)</text><text x="90.0" y="306.0" class="val" text-anchor="start">neurons active (log)</text><line x1="90" y1="268.0" x2="610" y2="268.0" stroke="#d1d9e0" stroke-opacity="1"/><text x="82.0" y="272.0" class="tick" text-anchor="end">0</text><line x1="90" y1="193.0" x2="610" y2="193.0" stroke="#d1d9e0" stroke-opacity="0.5"/><text x="82.0" y="197.0" class="tick" text-anchor="end">8</text><line x1="90" y1="118.0" x2="610" y2="118.0" stroke="#d1d9e0" stroke-opacity="0.5"/><text x="82.0" y="122.0" class="tick" text-anchor="end">16</text><line x1="90" y1="468.0" x2="610" y2="468.0" stroke="#d1d9e0" stroke-opacity="0.5"/><text x="82.0" y="472.0" class="tick" text-anchor="end">10</text><line x1="90" y1="412.4" x2="610" y2="412.4" stroke="#d1d9e0" stroke-opacity="0.5"/><text x="82.0" y="416.4" class="tick" text-anchor="end">100</text><line x1="90" y1="356.8" x2="610" y2="356.