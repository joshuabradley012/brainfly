f 16 rhythmic; 320 neurons active; DNg100 13.6 spikes/s</title></circle><circle cx="407.8" cy="258.6" r="4" fill="#1f2328" stroke="#ffffff" stroke-width="1.5"><title>left DNg100, drive 550: 1 of 16 rhythmic; 2120 neurons active; DNg100 7.4 spikes/s</title></circle><circle cx="407.8" cy="338.7" r="4" fill="#1f2328" stroke="#ffffff" stroke-width="1.5"><title>left DNg100, drive 550: 1 of 16 rhythmic; 2120 neurons active; DNg100 7.4 spikes/s</title></circle><circle cx="465.6" cy="268.0" r="4" fill="#1f2328" stroke="#ffffff" stroke-width="1.5"><title>left DNg100, drive 600: 0 of 16 rhythmic; 2154 neurons active; DNg100 0.9 spikes/s</title></circle><circle cx="465.6" cy="338.3" r="4" fill="#1f2328" stroke="#ffffff" stroke-width="1.5"><title>left DNg100, drive 600: 0 of 16 rhythmic; 2154 neurons active; DNg100 0.9 spikes/s</title></circle><circle cx="581.1" cy="268.0" r="4" fill="#1f2328" stroke="#ffffff" stroke-width="1.5"><title>left DNg100, drive 700: 0 of 16 rhythmic; 2180 neurons active; DNg100 0.0 spikes/s</title></circle><circle cx="581.1" cy="338.0" r="4" fill="#1f2328" stroke="#ffffff" stroke-width="1.5"><title>left DNg100, drive 700: 0 of 16 rhythmic; 2180 neurons active; DNg100 0.0 spikes/s</title></circle><line x1="100" y1="526" x2="120" y2="526" stroke="#b8322a" stroke-width="2"/><text x="126.0" y="530.0" class="tick" text-anchor="start">right DNg100</text><line x1="250" y1="526" x2="270" y2="526" stroke="#1f2328" stroke-width="2"/><text x="276.0" y="530.0" class="tick" text-anchor="start">left DNg100</text><text x="720.0" y="106.0" class="val" text-anchor="start">with DNg97 added: rhythm frequency, against DNg100 alone</text><line x1="720" y1="424.2" x2="1080" y2="424.2" stroke="#d1d9e0" stroke-opacity="1"/><text x="712.0" y="428.2" class="tick" text-anchor="end">1x</text><line x1="720" y1="314.9" x2="1080" y2="314.9" stroke="#d1d9e0" stroke-opacity="0.5"/><text x="712.0" y="318.9" class="tick" text-anchor="end">1.25x</text><line x1="720" y1="205.5" x2="1080" y2="205.5" stroke="#d1d9e0" stroke-opacity="0.5"/><text x="712.0" y="209.5" class="tick" text-anchor="end">1.5x</text><rect x="720" y="161.7" width="360" height="87.5" fill="#1f2328" fill-opacity="0.07"><title>flies: co-activating DNg97 raises ball stepping from about 8 to 12 Hz (Sapkal et al. 2026)</title></rect><text x="1074.0" y="155.7" class="tick" text-anchor="end">flies: about 1.5x (Sapkal et al. 2026)</text><text x="750.0" y="486.0" class="tick" text-anchor="middle">0</text><text x="825.0" y="486.0" class="tick" text-anchor="middle">100</text><text x="900.0" y="486.0" class="tick" text-anchor="middle">200</text><text x="1050.0" y="486.0" class="tick" text-anchor="middle">400</text><text x="900.0" y="506.0" class="tick" text-anchor="middle">DNg97's drive (DNg100 at 400)</text><circle cx="750.0" cy="424.2" r="7.0" fill="#b8322a" stroke="#ffffff" stroke-width="1.5"><title>right DNg100, DNg97 0: 11.4 Hz, 16 of 16 rhythmic</title></circle><circle cx="825.0" cy="405.1" r="7.0" fill="#b8322a" stroke="#ffffff" stroke-width="1.5"><title>right DNg100, DNg97 100: 11.9 Hz, 16 of 16 rhythmic</title></circle><text x="834.0" y="396.1" class="tiny" text-anchor="start">16/16</text><circle cx="900.0" cy="355.2" r="6.5" fill="#b8322a" stroke="#ffffff" stroke-width="1.5"><title>right DNg100, DNg97 200: 13.2 Hz, 13 of 16 rhythmic</title></circle><text x="909.0" y="346.2" class="tiny" text-anchor="start">13/16</text><circle cx="1050.0" cy="374.4" r="4.2" fill="#b8322a" stroke="#ffffff" stroke-width="1.5"><title>right DNg100, DNg97 400: 12.7 Hz, 3 of 16 rhythmic</title></circle><text x="1059.0" y="365.4" class="tiny" text-anchor="start">3/16</text><polyline points="750.0,424.2 825.0,405.1 900.0,355.2 1050.0,374.4" fill="none" stroke="#b8322a" stroke-width="1.6"/><circle cx="750.0" cy="424.2" r="7.0" fill="#1f2328" stroke="#ffffff" stroke-width="1.5"><title>left DNg100, DNg97 0: 13.0 Hz, 16 of 16 rhythmic</title></circle><circle cx="825.0" cy="394.0" r="6.7" fill="#1f2328" stroke="