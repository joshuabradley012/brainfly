 fill="#e5533f" text-anchor="middle">in progress</text><circle cx="171.0" cy="415.0" r="4.5" fill="#e5533f" stroke="#e5533f" stroke-width="1.4"/><text x="181.0" y="420.0" class="mark">16/16 motion directions</text><circle cx="358.4" cy="415.0" r="4.5" fill="#e5533f" stroke="#e5533f" stroke-width="1.4"/><text x="368.4" y="420.0" class="mark">looming reaches LC4, LPLC2, giant fiber</text><circle cx="648.9" cy="415.0" r="4.5" fill="none" stroke="#9198a1" stroke-width="1.4"/><text x="658.9" y="420.0" class="mark">30 of 32 polarities</text></g><g><path d="M36 343.0H100" stroke="#e5533f" stroke-width="5" stroke-linecap="round"/><text x="136" y="339.0" class="num" fill="#e5533f">4</text><text x="166" y="339.0" class="name">Central brain at rest</text><rect x="992.4" y="322.0" width="95.6" height="24" rx="12" fill="none" stroke="#e5533f" stroke-width="1.5"/><text x="1040.2" y="339.0" class="pill" fill="#e5533f" text-anchor="middle">in progress</text><circle cx="171.0" cy="357.0" r="4.5" fill="#e5533f" stroke="#e5533f" stroke-width="1.4"/><text x="181.0" y="362.0" class="mark">rests at the measured rates, nothing runs away</text><circle cx="506.7" cy="357.0" r="4.5" fill="#e5533f" stroke="#e5533f" stroke-width="1.4"/><text x="516.7" y="362.0" class="mark">taste and escape still pass at rest</text><circle cx="771.5" cy="357.0" r="4.5" fill="none" stroke="#9198a1" stroke-width="1.4"/><text x="781.5" y="362.0" class="mark">a head-direction bump that moves like a fly's</text></g><g><rect x="116" y="259.0" width="990" height="52" rx="8" fill="#161b22"/><path d="M36 285.0H100" stroke="#e5533f" stroke-width="5" stroke-linecap="round"/><text x="136" y="281.0" class="num" fill="#e5533f">5</text><text x="166" y="281.0" class="name">Nerve cord</text><rect x="992.4" y="264.0" width="95.6" height="24" rx="12" fill="none" stroke="#e5533f" stroke-width="1.5"/><text x="1040.2" y="281.0" class="pill" fill="#e5533f" text-anchor="middle">in progress</text><circle cx="171.0" cy="299.0" r="4.5" 