    </style><rect width="1120" height="400" fill="#0d1117"/><text x="24.0" y="30.0" class="lab" text-anchor="start">Cutting HS and H2 removes most of the yaw neck neurons' drum signal; in CvN7, OCG01f cancels most of VS's drive</text><text x="24.0" y="50.0" class="note" text-anchor="start">Rung 6's whole brain with its eyes, open loop, 8 flies on one seed. Cutting only HS's and H2's synapses removes more of each yaw</text><text x="24.0" y="68.0" class="note" text-anchor="start">neuron's signal than their share of its drive (grey ticks): they also hold the cells near threshold. CvN6 follows the drum mostly via VS.</text><text x="24.0" y="102.0" class="val" text-anchor="start">Yaw neck MNs' drum signal</text><line x1="156.0" y1="124" x2="156.0" y2="332" stroke="#3d444d" stroke-width="1"/><text x="156.0" y="348.0" class="tiny" text-anchor="middle">0</text><line x1="217.0" y1="124" x2="217.0" y2="332" stroke="#3d444d" stroke-width="1"/><text x="217.0" y="348.0" class="tiny" text-anchor="middle">20</text><line x1="278.0" y1="124" x2="278.0" y2="332" stroke="#3d444d" stroke-width="1"/><text x="278.0" y="348.0" class="tiny" text-anchor="middle">40</text><line x1="339.0" y1="124" x2="339.0" y2="332" stroke="#3d444d" stroke-width="1"/><text x="339.0" y="348.0" class="tiny" text-anchor="middle">60</text><line x1="400.0" y1="124" x2="400.0" y2="332" stroke="#3d444d" stroke-width="1"/><text x="400.0" y="348.0" class="tiny" text-anchor="middle">80</text><text x="278.0" y="364.0" class="tiny" text-anchor="middle">spikes/s</text><text x="24.0" y="156.0" class="tick" text-anchor="start">GNG283</text><line x1="232.8" y1="143.0" x2="232.8" y2="161.0" stroke="#6e7681" stroke-width="3"><title>GNG283: linear expectation 25.2 spikes/s (HS and H2 give 65% of the drive change)</title></line><line x1="377.4" y1="152.0" x2="183.4" y2="152.0" stroke="#6e7681" stroke-width="1.5"/><line x1="374.1" y1="152.0" x2="380.6" y2="152.0" stroke="#9198a1" stroke-width="1.5"/><line x1="179.9" y1="152.0" 