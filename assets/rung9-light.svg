    </style><rect width="1120" height="460" fill="#ffffff"/><text x="24.0" y="30.0" class="lab" text-anchor="start">Rung 9's learning test, attempt 1 (pre-registered): failed</text><text x="24.0" y="50.0" class="note" text-anchor="start">Each column: how far MBON11's response falls after an odor is paired with dopamine. Shaded: the band fixed in advance; rings: flies (Hige et al. 2015); red: the model.</text><text x="24.0" y="68.0" class="note" text-anchor="start">3-octanol paired, the model is as specific as flies; 4-methylcyclohexanol paired, it barely touches 3-octanol, whose input its few Kenyon cells hardly carry.</text><line x1="90" y1="342.0" x2="1070" y2="342.0" stroke="#d1d9e0" stroke-opacity="0.5"/><text x="82.0" y="346.0" class="tick" text-anchor="end">-25%</text><line x1="90" y1="302.0" x2="1070" y2="302.0" stroke="#d1d9e0" stroke-opacity="1"/><text x="82.0" y="306.0" class="tick" text-anchor="end">0%</text><line x1="90" y1="262.0" x2="1070" y2="262.0" stroke="#d1d9e0" stroke-opacity="0.5"/><text x="82.0" y="266.0" class="tick" text-anchor="end">25%</text><line x1="90" y1="222.0" x2="1070" y2="222.0" stroke="#d1d9e0" stroke-opacity="0.5"/><text x="82.0" y="226.0" class="tick" text-anchor="end">50%</text><line x1="90" y1="182.0" x2="1070" y2="182.0" stroke="#d1d9e0" stroke-opacity="0.5"/><text x="82.0" y="186.0" class="tick" text-anchor="end">75%</text><line x1="90" y1="142.0" x2="1070" y2="142.0" stroke="#d1d9e0" stroke-opacity="0.5"/><text x="82.0" y="146.0" class="tick" text-anchor="end">100%</text><text transform="translate(40,230.0) rotate(-90)" class="tick" text-anchor="middle">fall after pairing</text><rect x="134.0" y="110.0" width="52" height="88.0" rx="3" fill="#1f2328" fill-opacity="0.12"><title>band: 65-100%</title></rect><circle cx="150.0" cy="174.0" r="5" fill="#ffffff" stroke="#1f2328" stroke-width="1.6"><title>flies: 80%</title></circle><circle cx="170.0" cy="159.9" r="6" fill="#b8322a" stroke="#ffffff" stroke-width="2"><title>model: 88.8%