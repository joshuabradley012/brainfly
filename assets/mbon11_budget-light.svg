d: 191 pC</title></rect><text x="763.0" y="230.5" class="tick" text-anchor="middle" style="fill: #ffffff">191</text><rect x="802" y="290.6" width="50" height="89.4" fill="#b8322a" fill-opacity="1.0"><title>3-octanol, after depression: 103 pC</title></rect><text x="827.0" y="306.6" class="tick" text-anchor="middle" style="fill: #ffffff">103</text><text x="795.0" y="396.0" class="tiny" text-anchor="middle">3-octanol</text><rect x="900" y="143.4" width="150" height="37.3" fill="#1f2328" fill-opacity="0.12"><title>flies 230-273 pC</title></rect><rect x="918" y="359.7" width="50" height="20.3" fill="#1f2328" fill-opacity="0.85"><title>4-methylcyclohexanol, undepressed: 23 pC</title></rect><text x="943.0" y="353.7" class="tick" text-anchor="middle">23</text><rect x="982" y="365.5" width="50" height="14.5" fill="#b8322a" fill-opacity="1.0"><title>4-methylcyclohexanol, after depression: 17 pC</title></rect><text x="1007.0" y="359.5" class="tick" text-anchor="middle">17</text><text x="975.0" y="396.0" class="tiny" text-anchor="middle">4-methylcyclohexanol</text><rect x="700" y="426" width="14" height="12" fill="#1f2328" fill-opacity="0.85"/><text x="720.0" y="436.0" class="tick" text-anchor="start">undepressed</text><rect x="815" y="426" width="14" height="12" fill="#b8322a"/><text x="835.0" y="436.0" class="tick" text-anchor="start">after depression</text><rect x="955" y="426" width="14" height="12" fill="#1f2328" fill-opacity="0.12"/><text x="975.0" y="436.0" class="tick" text-anchor="start">flies</text></svg>