<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470" role="img" aria-labelledby="t"><title id="t">MBON11 gets flies' budget of Kenyon cell synapse-spikes to 3-octanol but under half flies' charge after the synapses' depression; to 4-methylcyclohexanol a seventh of the activity</title><style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .lab { font-size: 16px; font-weight: 600; fill: #1f2328; }
    .val { font-size: 13px; font-weight: 600; fill: #1f2328; }
    .note { font-size: 13px; fill: #59636e; }
    .tick { font-size: 11px; fill: #59636e; }
    .tiny { font-size: 10px; fill: #59636e; }
    </style><rect width="1120" height="470" fill="#ffffff"/><text x="24.0" y="30.0" class="lab" text-anchor="start">MBON11's input: flies' budget of Kenyon cell activity, under half flies' charge</text><text x="24.0" y="50.0" class="note" text-anchor="start">With the corrected input the Kenyon cells give MBON11 about flies' budget of synapse-spikes to 3-octanol (3,536; flies about 3,200), three quarters of flies' charge undepressed.</text><text x="24.0" y="68.0" class="note" text-anchor="start">The synapses' depression leaves about half of that. To 4-methylcyclohexanol the activity itself is a seventh of flies'.</text><text x="80.0" y="106.0" class="val" text-anchor="start">Synapse-spikes onto MBON11_R, 0-1.4 s</text><line x1="80" y1="380.0" x2="550" y2="380.0" stroke="#d1d9e0" stroke-opacity="1"/><text x="74.0" y="384.0" class="tick" text-anchor="end">0</text><line x1="80" y1="315.0" x2="550" y2="315.0" stroke="#d1d9e0" stroke-opacity="0.45"/><text x="74.0" y="319.0" class="tick" text-anchor="end">2,000</text><line x1="80" y1="250.0" x2="550" y2="250.0" stroke="#d1d9e0" stroke-opacity="0.45"/><text x="74.0" y="254.0" class="tick" text-anchor="end">4,000</text><line x1="80" y1="185.0" x2="550" y2="185.0" stroke="#d1d9e0" stroke-opacity="0.45"/><text x="74.0" y="189.0" class="tick" text-anchor="end">6,000</text><line x1="80" y1="120.0" x2="550" y2="120.0" stroke="#d1d9e0" stroke-opacity="0.45"/><text x="74.0" y="124.0" class="tick" text-anchor="end">8,000</text><rect x="120" y="334.0" width="62" height="46.0" fill="#1f2328" fill-opacity="0.85"><title>3-octanol, model, γ: 1,416</title></rect><rect x="120" y="271.5" width="62" height="62.5" fill="#b8322a" fill-opacity="1.0"><title>3-octanol, model, α/β: 1,922</title></rect><rect x="120" y="265.1" width="62" height="6.4" fill="#8c959f" fill-opacity="1.0"><title>3-octanol, model, α′/β′: 198</title></rect><text x="151.0" y="259.1" class="tick" text-anchor="middle">3,536</text><text x="151.0" y="396.0" class="tick" text-anchor="middle">model</text><rect x="225" y="321.9" width="62" height="58.1" fill="#1f2328" fill-opacity="0.85"><title>3-octanol, flies, γ: 1,786</title></rect><rect x="225" y="286.7" width="62" height="35.2" fill="#b8322a" fill-opacity="1.0"><title>3-octanol, flies, α/β: 1,084</title></rect><rect x="225" y="275.8" width="62" height="10.9" fill="#8c959f" fill-opacity="1.0"><title>3-octanol, flies, α′/β′: 336</title></rect><line x1="296.0" y1="337.8" x2="296.0" y2="136.2" stroke="#1f2328" stroke-width="1.5"><title>the range for flies, 1,300-7,500</title></line><line x1="291.0" y1="337.8" x2="301.0" y2="337.8" stroke="#1f2328" stroke-width="1.5"/><line x1="291.0" y1="136.2" x2="301.0" y2="136.2" stroke="#1f2328" stroke-width="1.5"/><text x="256.0" y="269.8" class="tick" text-anchor="middle">3,206</text><text x="256.0" y="396.0" class="tick" text-anchor="middle">flies</text><rect x="350" y="376.3" width="62" height="3.7" fill="#1f2328" fill-opacity="0.85"><title>4-methylcyclohexanol, model, γ: 113</title></rect><rect x="350" y="368.3" width="62" height="8.0" fill="#b8322a" fill-opacity="1.0"><title>4-methylcyclohexanol, model, α/β: 246</title></rect><rect x="350" y="365.9" width="62" height="2.5" fill="#8c959f" fill-opacity="1.0"><title>4-methylcyclohexanol, model, α′/β′: 75</title></rect><text x="381.0" y="359.9" class="tick" text-anchor="middle">434</text><text x="381.0" y="396.0" class="tick" text-anchor="middle">model</text><rect x="455" y="321.9" width="62" height="58.1" fill="#1f2328" fill-opacity="0.85"><title>4-methylcyclohexanol, flies, γ: 1,786</title></rect><rect x="455" y="286.7" width="62" height="35.2" fill="#b8322a" fill-opacity="1.0"><title>4-methylcyclohexanol, flies, α/β: 1,084</title></rect><rect x="455" y="275.8" width="62" height="10.9" fill="#8c959f" fill-opacity="1.0"><title>4-methylcyclohexanol, flies, α′/β′: 336</title></rect><line x1="526.0" y1="337.8" x2="526.0" y2="136.2" stroke="#1f2328" stroke-width="1.5"><title>the range for flies, 1,300-7,