<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="570" viewBox="0 0 1120 570" role="img" aria-labelledby="t"><title id="t">brainfly's ladder of nine rungs, from a validated baseline to state and learning, and where each stands</title><style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .num { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .name { font-size: 17px; font-weight: 600; fill: #1f2328; }
    .mark { font-size: 13.5px; fill: #59636e; }
    .pill { font-size: 12.5px; font-weight: 600; }
    </style><rect width="1120" height="570" fill="#ffffff"/><path d="M36 14V556M100 14V556" stroke="#59636e" stroke-width="3" stroke-linecap="round"/><g><rect x="116" y="491.0" width="990" height="52" rx="8" fill="#f6f8fa"/><path d="M36 517.0H100" stroke="#b8322a" stroke-width="7" stroke-linecap="round"/><text x="136" y="513.0" class="num" fill="#b8322a">1</text><text x="166" y="513.0" class="name">Validated baseline</text><rect x="1030.4" y="496.0" width="57.6" height="24" rx="12" fill="#b8322a"/><text x="1059.2" y="513.0" class="pill" fill="#ffffff" text-anchor="middle">passed</text><circle cx="171.0" cy="531.0" r="4.5" fill="#b8322a" stroke="#b8322a" stroke-width="1.4"/><text x="181.0" y="536.0" class="mark">sugar drives the proboscis motor neuron; bitter suppresses it; rewiring abolishes it</text></g><g><path d="M36 459.0H100" stroke="#b8322a" stroke-width="7" stroke-linecap="round"/><text x="136" y="455.0" class="num" fill="#b8322a">2</text><text x="166" y="455.0" class="name">Signs and modulators</text><rect x="1030.4" y="438.0" width="57.6" height="24" rx="12" fill="#b8322a"/><text x="1059.2" y="455.0" class="pill" fill="#ffffff" text-anchor="middle">passed</text><circle cx="171.0" cy="473.0" r="4.5" fill="#b8322a" stroke="#b8322a" stroke-width="1.4"/><text x="181.0" y="478.0" class="mark">consensus transmitters; monoamines out of fast excitation</text><circle cx="577.7" cy="473.0" r="4.5" fill="#b8322a" stroke="#b8322a" stroke-width="1.4"/><text x="587.7" y="478.0" class="mark">signs audited by hemilineage; false positives 1 in 100</text></g><g><rect x="116" y="375.0" width="990" height="52" rx="8" fill="#f6f8fa"/><path d="M36 401.0H100" stroke="#b8322a" stroke-width="7" stroke-linecap="round"/><text x="136" y="397.0" class="num" fill="#b8322a">3</text><text x="166" y="397.0" class="name">Eye and optic lobe</text><rect x="1030.4" y="380.0" width="57.6" height="24" rx="12" fill="#b8322a"/><text x="1059.2" y="397.0" class="pill" fill="#ffffff" text-anchor="middle">passed</text><circle cx="171.0" cy="415.0" r="4.5" fill="#b8322a" stroke="#b8322a" stroke-width="1.4"/><text x="181.0" y="420.0" class="mark">16/16 motion directions in the eye (fitted; weak)</text><circle cx="526.0" cy="415.0" r="4.5" fill="#b8322a" stroke="#b8322a" stroke-width="1.4"/><text x="536.0" y="420.0" class="mark">looming reaches LC4 and LPLC2 (as in model 001)</text><circle cx="868.2" cy="415.0" r="4.5" fill="#b8322a" stroke="#b8322a" stroke-width="1.4"/><text x="878.2" y="420.0" class="mark">31 of 32 polarities (fitted)</text></g><g><path d="M36 343.0H100" stroke="#b8322a" stroke-width="7" stroke-linecap="round"/><text x="136" y="339.0" class="num" fill="#b8322a">4</text><text x="166" y="339.0" class="name">Central brain at rest</text><rect x="1030.4" y="322.0" width="57.6" height="24" rx="12" fill="#b8322a"/><text x="1059.2" y="339.0" class="pill" fill="#ffffff" text-anchor="middle">passed</text><circle cx="171.0" cy="357.0" r="4.5" fill="#b8322a" stroke="#b8322a" stroke-width="1.4"/><text x="181.0" y="362.0" class="mark">rests at its 8 targeted rates, nothing runs away</text><circle cx="519.6" cy="357.0" r="4.5" fill="#b8322a" stroke="#b8322a" stroke-width="1.4"/><text x="529.6" y="362.0" class="mark">taste and escape still pass at rest</text><circle cx="784.4" cy="357.0" r="4.5" fill="#b8322a" stroke="#b8322a" stroke-width="1.4"/><text x="794.4" y="362.0" class="mark">a head-direction bump (fitted; still leaning)</text></g><g><rect x="116" y="259.0" width="990" height="52" rx="8" fill="#f6f8fa"/><path d="M36 285.0H100" stroke="#b8322a" stroke-width="5" stroke-linecap="round"/><text x="136" y="281.0" class="num" fill="#b8322a">5</text><text x="166" y="281.0" class="name">Nerve cord</text><rect x="992.4" y="264.0" width="95.6" height="24" rx="12" fill="none" stroke="#b8322a" stroke-width="1.5"/><text x="1040.2" y="281.0" class="pill" fill="#b8322a" text-anchor="middle">in progress</text><circle cx="171.0" cy="299.0" r="4.5" fill="none" stroke="#59636e" stroke-width="1.4"/><text x="181.0" y="304.0" class="mark">DNg100 drives 7-15 Hz leg rhythms (attempt 3: one side a run short)</text><circle cx="642.2" cy="299.0" r="4.5" fill="#b8322a" stroke="#b8322a" stroke-width="1.4"/><text x="652.2" y="304.0" class="mark">DNb08 drives them</text><circle cx="790.8" cy="299.0" r="4.5" fill="#b8322a" stroke="#b8322a" stroke-width="1.4"/><text x="800.8" y="304.0" class="mark">scrambled wiring doesn't, at any drive</text></g><g><path d="M36 227.0H100" stroke="#b8322a" stroke-width="7" stroke-linecap="round"/><text x="136" y="223.0" class="num" fill="#b8322a">6</text><text x="166" y="223.0" class="name">Gap junctions and proprioception</text><rect x="992.4" y="206.0" width="95.6" height="24" rx="12" fill="#b8322a"/><text x="1040.2" y="223.0" class="pill" fill="#ffffff" text-anchor="middle">half passed</text><circle cx="171.0" cy="241.0" r="4.5" fill="#b8322a" stroke="#b8322a" stroke-width="1.4"/><text x="181.0" y="246.0" class="mark">electrical synapses in the model</text><circle cx="416.4" cy="241.0" r="4.5" fill="#b8322a" stroke="#b8322a" stroke-width="1.4"/><text x="426.4" y="246.0" class="mark">giant fiber to jump muscle in 0.9 ms (built in); silent without them</text><circle cx="894.0" cy="241.0" r="4.5" fill="none" stroke="#59636e" stroke-width="1.4"/><text x="904.0" y="246.0" class="mark">leg sensors driven by the body</text></g><g><rect x="116" y="143.0" width="990" height="52" rx="8" fill="#f6f8fa"/><path d="M36 169.0H100" stroke="#b8322a" stroke-width="5" stroke-linecap="round"/><text x="136" y="165.0" class="num" fill="#b8322a">7</text><text x="166" y="165.0" class="name">Body and muscles</text><rect x="1022.8" y="148.0" width="65.2" height="24" rx="12" fill="none" stroke="#b8322a" stroke-width="1.5"/><text x="1055.4" y="165.0" class="pill" fill="#b8322a" text-anchor="middle">started</text><circle cx="171.0" cy="183.0" r="4.5" fill="#b8322a" stroke="#b8322a" stroke-width="1.4"/><text x="181.0" y="188.0" class="mark">NeuroMechFly walks, steered by DNa02</text><circle cx="442.2" cy="183.0" r="4.5" fill="#b8322a" stroke="#b8322a" stroke-width="1.4"/><text x="452.2" y="188.0" class="mark">jumps from jump motor neuron spikes</text><circle cx="707.0" cy="183.0" r="4.5" fill="none" stroke="#59636e" stroke-width="1.4"/><text x="717.0" y="188.0" class="mark">motor neurons drive muscles</text></g><g><path d="M36 111.0H100" stroke="#d1d9e0" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 7"/><text x="136" y="107.0" class="num" fill="#59636e">8</text><text x="166" y="107.0" class="name">Flight, neck and song</text><rect x="992.4" y="90.0" width="95.6" height="24" rx="12" fill="none" stroke="#d1d9e0" stroke-width="1.5"/><text x="1040.2" y="107.0" class="pill" fill="#59636e" text-anchor="middle">not started</text><circle cx="171.0" cy="125.0" r="4.5" fill="none" stroke="#59636e" stroke-width="1.4"/><text x="181.0" y="130.0" class="mark">saccades, head pose, song pulses</text></g><g><rect x="116" y="27.0" width="990" height="52" rx="8" fill="#f6f8fa"/><path d="M36 53.0H100" stroke="#b8322a" stroke-width="5" stroke-linecap="round"/><text x="136" y="49.0" class="num" fill="#b8322a">9</text><text x="166" y="49.0" class="name">State and learning</text><rect x="1022.8" y="32.0" width="65.2" height="24" rx="12" fill="none" stroke="#b8322a" stroke-width="1.5"/><text x="1055.4" y="49.0" class="pill" fill="#b8322a" text-anchor="middle">started</text><circle cx="171.0" cy="67.0" r="4.5" fill="#b8322a" stroke="#b8322a" stroke-width="1.4"/><text x="181.0" y="72.0" class="mark">pairing depresses MBON11's response to the odor</text><circle cx="513.2" cy="67.0" r="4.5" fill="#b8322a" stroke="#b8322a" stroke-width="1.4"/><text x="523.2" y="72.0" class="mark">sparing the unpaired odor as flies' does</text><circle cx="810.2" cy="67.0" r="4.5" fill="none" stroke="#59636e" stroke-width="1.4"/><text x="820.2" y="72.0" class="mark">both ways round (attempt 1: one way)</text><circle cx="1081.4" cy="67.0" r="4.5" fill="none" stroke="#59636e" stroke-width="1.4"/><text x="1091.4" y="72.0" class="mark">final hurdle: resting FC, once arousal sets the brain-wide state</text></g></svg>