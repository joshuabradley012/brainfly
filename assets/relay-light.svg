<polyline points="845.0,270.0 870.0,270.0 895.0,270.0 945.0,270.0 995.0,92.7 1045.0,90.0" fill="none" stroke="#1f2328" stroke-width="1.8" stroke-dasharray="5 3"/>
<line x1="925.0" y1="90" x2="925.0" y2="270" stroke="#b8322a" stroke-width="1.2" stroke-dasharray="5 3"/>
