<text x="845.0" y="286.0" class="lab" text-anchor="middle">2</text>
<text x="895.0" y="286.0" class="lab" text-anchor="middle">4</text>
<text x="945.0" y="286.0" class="lab" text-anchor="middle">6</text>
<text x="995.0" y="286.0" class="lab" text-anchor="middle">8</text>
