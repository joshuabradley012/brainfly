<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="350" viewBox="0 0 1120 350" role="img" aria-labelledby="t">
<title id="t">The giant fiber relay in brainfly: muscle latencies, following at 100 and 250 Hz, and twin-pulse refractoriness, intact and without electrical synapses, against flies</title>
<style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; } .h { font-size: 16px; font-weight: 600; fill: #1f2328; } .lab { font-size: 12px; fill: #59636e; } .val { font-size: 13px; font-weight: 600; fill: #1f2328; }</style>
<rect width="1120" height="350" fill="#ffffff"/>
<text x="40.0" y="36.0" class="h" text-anchor="start">Latency after a giant fiber spike</text>
<rect x="218.0" y="100" width="28.0" height="20" fill="#f3e1df"/>
<circle cx="227.3" cy="110" r="5" fill="#b8322a"/>
<text x="180.0" y="114.0" class="lab" text-anchor="end">jump muscle (TTM)</text>
<rect x="264.7" y="160" width="28.0" height="20" fill="#f3e1df"/>
<circle cx="274.0" cy="170" r="5" fill="#b8322a"/>
<text x="180.0" y="174.0" class="lab" text-anchor="end">flight muscle (DLM)</text>
<text x="190.0" y="240.0" class="lab" text-anchor="middle">0.5</text>
<text x="236.7" y="240.0" class="lab" text-anchor="middle">1</text>
<text x="283.3" y="240.0" class="lab" text-anchor="middle">1.5</text>
<text x="330.0" y="240.0" class="lab" text-anchor="middle">2</text>
<text x="260.0" y="258.0" class="lab" text-anchor="middle">ms (band: flies; dot: brainfly)</text>
<text x="40.0" y="300.0" class="val" text-anchor="start">Without electrical synapses: TTMn answer 0%, DLMn 0%</text>
<text x="40.0" y="320.0" class="lab" text-anchor="start">of single giant fiber spikes (shakB² flies: 0-57% and none)</text>
<text x="420.0" y="36.0" class="h" text-anchor="start">Following 10-spike trains</text>
<rect x="440" y="90.0" width="22" height="2.0" fill="#f3e1df" stroke="#b8322a" stroke-width="0.8"/>
<rect x="462.0" y="90.0" width="19" height="180.0" fill="#1f2328"/>
<rect x="484.0" y="270.0" width="19" height="1.0" fill="#59636e"/>
<text x="473.0" y="286.0" class="lab" text-anchor="middle">TTMn</text>
<text x="473.0" y="300.0" class="lab" text-anchor="middle">100 Hz</text>
<rect x="524" y="90.0" width="22" height="21.6" fill="#f3e1df" stroke="#b8322a" stroke-width="0.8"/>
<rect x="546.0" y="90.0" width="19" height="180.0" fill="#1f2328"/>
<rect x="568.0" y="270.0" width="19" height="1.0" fill="#59636e"/>
<text x="557.0" y="286.0" class="lab" text-anchor="middle">TTMn</text>
<text x="557.0" y="300.0" class="lab" text-anchor="middle">250 Hz</text>
<rect x="608" y="118.8" width="22" height="2.0" fill="#f3e1df" stroke="#b8322a" stroke-width="0.8"/>
<rect x="630.0" y="114.0" width="19" height="156.0" fill="#1f2328"/>
<rect x="652.0" y="270.0" width="19" height="1.0" fill="#59636e"/>
<text x="641.0" y="286.0" class="lab" text-anchor="middle">DLMn</text>
<text x="641.0" y="300.0" class="lab" text-anchor="middle">100 Hz</text>
<rect x="692" y="167.4" width="22" height="52.2" fill="#f3e1df" stroke="#b8322a" stroke-width="0.8"/>
<rect x="714.0" y="198.0" width="19" height="72.0" fill="#1f2328"/>
<rect x="736.0" y="270.0" width="19" height="1.0" fill="#59636e"/>
<text x="725.0" y="286.0" class="lab" text-anchor="middle">DLMn</text>
<text x="725.0" y="300.0" class="lab" text-anchor="middle">250 Hz</text>
<line x1="420" y1="270" x2="750" y2="270" stroke="#d1d9e0"/>
<text x="420.0" y="326.0" class="lab" text-anchor="start">each group: flies (band), brainfly intact (dark), without electrical synapses (grey)</text>
<text x="800.0" y="36.0" class="h" text-anchor="start">Second of two spikes answered</text>
<polyline points="845.0,270.0 870.0,90.0 895.0,90.0 945.0,90.0 995.0,90.0 1045.0,90.0" fill="none" stroke="#1f2328" stroke-width="1.8"/>
<line x1="877.5" y1="90" x2="877.5" y2="270" stroke="#b8322a" stroke-width="1.2"/>
