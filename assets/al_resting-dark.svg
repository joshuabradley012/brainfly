<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470" role="img" aria-labelledby="t"><title id="t">The antennal lobe at rest: projection neurons' free membrane potential with receptor neurons silenced and with GABA blocked, two models against flies</title><style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .lab { font-size: 16px; font-weight: 600; fill: #e6edf3; }
    .val { font-size: 13px; font-weight: 600; fill: #e6edf3; }
    .note { font-size: 13px; fill: #9198a1; }
    .tick { font-size: 11px; fill: #9198a1; }
    </style><rect width="1120" height="470" fill="#0d1117"/><text x="24.0" y="30.0" class="lab" text-anchor="start">The antennal lobe at rest: the model's postsynaptic GABA already disinhibits like flies'</text><text x="24.0" y="50.0" class="note" text-anchor="start">Grey: blocking GABA raises the PNs 5 mV (flies 5-8) with no tonic presynaptic inhibition. Red: dividing the receptor synapses by 2 at rest (Nagel et al.'s form)</text><text x="24.0" y="68.0" class="note" text-anchor="start">shrinks the resting drive, still twice flies', but makes the disinhibition overshoot. Membrane potentials as they would sit without the PNs' own spikes.</text><text x="80.0" y="110.0" class="val" text-anchor="start">Every receptor neuron silenced: the fall, by glomerulus</text><line x1="80" y1="374.0" x2="640" y2="374.0" stroke="#3d444d" stroke-opacity="1"/><text x="72.0" y="378.0" class="tick" text-anchor="end">0</text><line x1="80" y1="312.5" x2="640" y2="312.5" stroke="#3d444d" stroke-opacity="0.5"/><text x="72.0" y="316.5" class="tick" text-anchor="end">10</text><line x1="80" y1="251.0" x2="640" y2="251.0" stroke="#3d444d" stroke-opacity="0.5"/><text x="72.0" y="255.0" class="tick" text-anchor="end">20</text><line x1="80" y1="189.5" x2="640" y2="189.5" stroke="#3d444d" stroke-opacity="0.5"/><text x="72.0" y="193.5" class="tick" text-anchor="end">30</text><line x1="80" y1="128.0" x2="640" y2="128.0" stroke="#3d444d" stroke-opacity="0.5"/><text x="72.0" y="132.0" class="tick" text-anchor="end">40</text><text transform="translate(36,251.0) rotate(-90)" class="tick" text-anchor="middle">mV</text><rect x="80" y="312.5" width="560" height="30.8" fill="#e6edf3" fill-opacity="0.08"><title>Gouwens &amp; Wilson 2009: 5-10 mV over unstated glomeruli</title></rect><text x="636.0" y="307.5" class="tick" text-anchor="end">Gouwens &amp; Wilson: 5-10 mV</text><circle cx="101.0" cy="339.6" r="5" fill="#0d1117" stroke="#e6edf3" stroke-width="1.6"><title>flies, estimated: 5.6 mV</title></circle><li