="1.6"><title>flies, estimated: 14.6 mV</title></circle><line x1="607.0" y1="201.7" x2="617.0" y2="253.6" stroke="#6e7681" stroke-width="1.2"/><circle cx="607.0" cy="201.7" r="5" fill="#6e7681" stroke="#0d1117" stroke-width="1.5"><title>without: 28.0 mV</title></circle><circle cx="617.0" cy="253.6" r="6" fill="#e5533f" stroke="#0d1117" stroke-width="2"><title>with: 19.6 mV</title></circle><text x="605.0" y="392.0" class="tick" text-anchor="middle">DA1</text><text x="760.0" y="110.0" class="val" text-anchor="start">GABA receptors blocked: the rise (flies 5-8 mV, shaded)</text><line x1="760" y1="374.0" x2="1080" y2="374.0" stroke="#3d444d" stroke-opacity="1"/><text x="752.0" y="378.0" class="tick" text-anchor="end">0</text><line x1="760" y1="312.5" x2="1080" y2="312.5" stroke="#3d444d" stroke-opacity="0.5"/><text x="752.0" y="316.5" class="tick" text-anchor="end">4</text><line x1="760" y1="251.0" x2="1080" y2="251.0" stroke="#3d444d" stroke-opacity="0.5"/><text x="752.0" y="255.0" class="tick" text-anchor="end">8</text><line x1="760" y1="189.5" x2="1080" y2="189.5" stroke="#3d444d" stroke-opacity="0.5"/><text x="752.0" y="193.5" class="tick" text-anchor="end">12</text><line x1="760" y1="128.0" x2="1080" y2="128.0" stroke="#3d444d" stroke-opacity="0.5"/><text x="752.0" y="132.0" class="tick" text-anchor="end">16</text><rect x="760" y="251.0" width="320" height="46.1" fill="#e6edf3" fill-opacity="0.12"><title>Nagel, Hong &amp; Wilson 2015: 5-8 mV (DM6, VM2, VM7)</title></rect><rect x="780.0" y="297.6" width="16" height="76.4" rx="3" fill="#6e7681"><title>without: 5.0 mV</title></rect><rect x="802.0" y="180.4" width="16" height="193.6" rx="3" fill="#e5533f"><title>with: 12.6 mV</title></rect><text x="800.0" y="392.0" class="tick" text-anchor="middle">DM6</text><rect x="860.0" y="307.6" width="16" height="66.4" rx="3" fill="#6e7681"><title>without: 4.3 mV</title></rect><rect x="882.0" y="204.1" width="16" height="169.9" rx="3" fill="#e5533f"><title>with: 11.1 mV</title></