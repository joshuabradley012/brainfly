<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" role="img" aria-labelledby="t"><title id="t">4-methylcyclohexanol's Kenyon cells sit mostly inside 3-octanol's in the model, unlike flies', and rung 9's marks follow</title><style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .lab { font-size: 16px; font-weight: 600; fill: #1f2328; }
    .val { font-size: 13px; font-weight: 600; fill: #1f2328; }
    .note { font-size: 13px; fill: #59636e; }
    .tick { font-size: 11px; fill: #59636e; }
    .tiny { font-size: 10px; fill: #59636e; }
    </style><rect width="1120" height="480" fill="#ffffff"/><text x="24.0" y="30.0" class="lab" text-anchor="start">Rung 9's crux: 4-methylcyclohexanol's Kenyon cells sit mostly inside 3-octanol's</text><text x="24.0" y="50.0" class="note" text-anchor="start">Flies' two odors reach separate sets of about the same size, sharing about a third each way. The model's 4-methylcyclohexanol reaches a smaller set, more than half</text><text x="24.0" y="68.0" class="note" text-anchor="start">inside 3-octanol's, however the Kenyon cells integrate. With set C, learning passes three marks, but pairing 3-octanol cuts 4-methylcyclohexanol twice as much as flies'.</text><text x="80.0" y="112.0" class="val" text-anchor="start">Kenyon cells answering, per 100 answering 3-octanol</text><text x="80.0" y="144.0" class="tick" text-anchor="start">flies (Hige et al. 2015)</text><rect x="80.0" y="152" width="132.6" height="22" fill="#1f2328" fill-opacity="0.85"><title>3-octanol only: 70</title></rect><rect x="214.6" y="152" width="57.4" height="22" fill="#b8322a" fill-opacity="1.0"><title>both: 30 (33% of 4-methylcyclohexanol's)</title></rect><rect x="274.0" y="152" width="118.3" height="22" fill="#8c959f" fill-opacity="1.0"><title>4-methylcyclohexanol only: 62</title></rect><text x="80.0" y="188.0" class="tiny" text-anchor="start">33% of 4-methylcyclohexanol's cells answer 3-octanol, 30% of 3-octanol's the other</text><text x="80.0" y="210.0" class="tick" text-anchor="start">model, Kenyon cells as now (set A)</text><rect x="80.0" y="218" width="172.7" height="22" fill="#1f2328" fill-opacity="0.85"><title>3-octanol only: 91</title></rect><rect x="254.7" y="218" width="17.3" height="22" fill="#b8322a" fill-opacity="1.0"><title>both: 9 (52% of 4-methylcyclohexanol's)</title></rect><rect x="274.0" y="218" width="16.0" height="22" fill="#8c959f" fill-opacity="1.0"><title>4-methylcyclohexanol only: 8</title></rect><text x="80.0" y="254.0" class="tiny" text-anchor="start">52% of 4-methylcyclohexanol's cells answer 3-octanol, 9% of 3-octanol's the other</text><text x="80.0" y="276.0" class="tick" text-anchor="start">model, integrating over 50 ms, depressing synapses (set C)</text><rect x="80.0" y="284" width="161.3" height="22" fill="#1f2328" fill-opacity="0.85"><title>3-octanol only: 85</title></rect><rect x="243.3" y="284" width="28.7" height="22" fill="#b8322a" fill-opacity="1.0"><title>both: 15 (61% of 4-methylcyclohexanol's)</title></rect><rect x="274.0" y="284" width="18.4" height="22" fill="#8c959f" fill-opacity="1.0"><title>4-methylcyclohexanol only: 10</title></rect><text x="80.0" y="320.0" class="tiny" text-anchor="start">61% of 4-methylcyclohexanol's cells answer 3-octanol, 15% of 3-octanol's the other</text><text x="80.0" y="342.0" class="tick" text-anchor="start">model, integrating over 189 ms, depressing synapses (set D)</text><rect x="80.0" y="350" width="117.8" height="22" fill="#1f2328" fill-opacity="0.85"><title>3-octanol only: 62</title></rect><rect x="199.8" y="350" width="72.2" height="22" fill="#b8322a" fill-opacity="1.0"><title>both: 38 (69% of 4-methylcyclohexanol's)</title></rect><rect x="274.0" y="350" width="32.5" height="22" fill="#8c959f" fill-opacity="1.0"><title>4-methylcyclohexanol only: 17</title></rect><text x="80.0" y="386.0" class="tiny" text-anchor="start">69% of 4-methylcyclohexanol's cells answer 3-octanol, 38% of 3-octanol's the other</text><rect x="80" y="400" width="14" height="12" fill="#1f2328" fill-opacity="0.85"/><text x="100.0" y="410.0" class="tick" text-anchor="start">3-octanol only</text><rect x="230" y="400" width="14" height="12" fill="#b8322a" fill-opacity="1.0"/><text x="250.0" y="410.0" class="tick" text-anchor="start">both</text><rect x="380" y="400" width="14" height="12" fill="#8c959f" fill-opacity="1.0"/><text x="400.0" y="410.0" class="tick" text-anchor="start">4-methylcyclohexanol only</text><text x="640.0" y="112.0" class="val" text-anchor="start">rung 9's marks: the spikes' drop</text><line x1="6