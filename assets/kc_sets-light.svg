<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470" role="img" aria-labelledby="t"><title id="t">4-methylcyclohexanol's Kenyon cells sit mostly inside 3-octanol's in the model, unlike flies', and rung 9's marks follow</title><style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .lab { font-size: 16px; font-weight: 600; fill: #1f2328; }
    .val { font-size: 13px; font-weight: 600; fill: #1f2328; }
    .note { font-size: 13px; fill: #59636e; }
    .tick { font-size: 11px; fill: #59636e; }
    .tiny { font-size: 10px; fill: #59636e; }
    </style><rect width="1120" height="470" fill="#ffffff"/><text x="24.0" y="30.0" class="lab" text-anchor="start">Rung 9's crux: 4-methylcyclohexanol's Kenyon cells sit inside 3-octanol's</text><text x="24.0" y="50.0" class="note" text-anchor="start">Flies' two odors reach separate sets of about the same size, sharing about a third each way. The model's 4-methylcyclohexanol reaches a small set, mostly inside</text><text x="24.0" y="68.0" class="note" text-anchor="start">3-octanol's. Kenyon cells that integrate longer (set C) widen it toward 3-octanol's, and the reciprocal mark passes, but pairing 3-octanol then cuts 4-methylcyclohexanol too.</text><text x="80.0" y="112.0" class="val" text-anchor="start">Kenyon cells answering, per 100 answering 3-octanol</text><text x="80.0" y="144.0" class="tick" text-anchor="start">flies (Hige et al. 2015)</text><rect x="80.0" y="152" width="129.9" height="22" fill="#1f2328" fill-opacity="0.85"><title>3-octanol only: 68</title></rect><rect x="211.9" y="152" width="60.1" height="22" fill="#b8322a" fill-opacity="1.0"><title>both: 32 (29% of 4-methylcyclohexanol's)</title></rect><rect x="274.0" y="152" width="145.4" height="22" fill="#8c959f" fill-opacity="1.0"><title>4-methylcyclohexanol only: 77</title></rect><text x="80.0" y="188.0" class="tiny" text-anchor="start">30-33% of each odor's cells answer the other</text><text x="80.0" y="222.0" class="tick" text-anchor="start">model, Kenyon cells as now (set A)</text><rect x="80.0" y="230" width="172.0" height="22" fill="#1f2328" fill-opacity="0.85"><title>3-octanol only: 91</title></rect><rect x="254.0" y="230" width="18.1" height="22" fill="#b8322a" fill-opacity="1.0"><title>both: 10 (53% of 4-methylcyclohexanol's)</title></rect><rect x="274.0" y="230" width="15.7" height="22" fill="#8c959f" fill-opacity="1.0"><title>4-methylcyclohexanol only: 8</title></rect><text x="80.0" y="266.0" class="tiny" text-anchor="start">53% of 4-methylcyclohexanol's cells answer 3-octanol, 10% of 3-octanol's the other</text><text x="80.0" y="300.0" class="tick" text-anchor="start">model, integrating longer (set C)</text><rect x="80.0" y="308" width="157.3" height="22" fill="#1f2328" fill-opacity="0.85"><title>3-octanol only: 83</title></rect><rect x="239.3" y="308" width="32.7" height="22" fill="#b8322a" fill-opacity="1.0"><title>both: 17 (62% of 4-methylcyclohexanol's)</title></rect><rect x="274.0" y="308" width="20.0" height="22" fill="#8c959f" fill-opacity="1.0"><title>4-methylcyclohexanol only: 11</title></rect><text x="80.0" y="344.0" class="tiny" text-anchor="start">62% of 4-methylcyclohexanol's cells answer 3-octanol, 17% of 3-octanol's the other</text><rect x="80" y="370" width="14" height="12" fill="#1f2328" fill-opacity="0.85"/><text x="100.0" y="380.0" class="tick" text-anchor="start">3-octanol only</text><rect x="230" y="370" width="14" height="12" fill="#b8322a" fill-opacity="1.0"/><text x="250.0" y="380.0" class="tick" text-anchor="start">both</text><rect x="380" y="370" width="14" height="12" fill="#8c959f" fill-opacity="1.0"/><text x="400.0" y="380.0" class="tick" text-anchor="start">4-methylcyclohexanol only</text><text x="640.0" y="112.0" class="val" text-anchor="start">rung 9's marks: the spikes' drop</text><line x1="640" y1="380.0" x2="1080" y2="380.0" stroke="#d1d9e0" stroke-opacity="1"/><text x="634.0" y="384.0" class="tick" text-anchor="end">0%</text><line x1="640" y1="317.5" x2="1080" y2="317.5" stroke="#d1d9e0" stroke-opacity="0.45"/><text x="634.0" y="321.5" class="tick" text-anchor="end">25%</text><line x1="640" y1="255.0" x2="1080" y2="255.0" stroke="#d1d9e0" stroke-opacity="0.45"/><text x="634.0" y="259.0" class="tick" text-anchor="end">50%</text><line x1="640" y1="192.5" x2="1080" y2="192.5" stroke="#d1d9e0" stroke-opacity="0.45"/><text x="634.0" y="196.5" class="tick" text-anchor="end">75%</text><line x1="640" y1="130.0" x2="1080" y2="130.0" stroke="#d1d9e0" stroke-opacity="0.45"/><text x="634.0" y="134.0" class="tick" text-anchor="end">100%</text><rect x="655.4" y="130.0" width="79.2" height="87.5" fill="#1f2328" fill-opacity="0.07"><title>PAIRED: the band rung 9 asks for, 65-100%</title></rect><line x1="655.4" y1="180.0" x2="734.6" y2="180.0" stroke="#1f2328" stroke-dasharray="3 3"><title>flies 80%</title></line><rect x="670.8" y="154.2" width="22.0" height="225.8" fill="#8c959f"><title>set A: 90.3% (passes)</title></rect><text x="681.8" y="149.2" class="tiny" text-anchor="middle">✓</text><rect x="697.2" y="149.0" width="22.0" height="231.0" fill="#b8322a"><title>set C: 92.4% (fails)</title></rect><text x="708.2" y="144.0" class="tiny" text-anchor="middle">✗</text><text x="695.0" y="396.0" class="tick" text-anchor="middle">PAIRED</text><text x="695.0" y="410.0" class="tiny" text-anchor="middle">3-octanol's own</text><rect x="765.4" y="267.5" width="79.2" height="87.5" fill="#1f2328" fill-opacity="0.07"><title>UNPAIRED: the band rung 9 asks for, 10-45%</title></rect><line x1="765.4" y1="312.5" x2="844.6" y2="312.5" stroke="#1f2328" stroke-dasharray="3 3"><title>flies 27%</title></line><rect x="780.8" y="274.8" width="22.0" height="105.2" fill="#8c959f"><title>set A: 42.1% (passes)</title></rect><text x="791.8" y="269.8" class="tiny" text-anchor="middle">✓</text><rect x="807.2" y="212.8" width="22.0" height="167.2" fill="#b8322a"><title>set C: 66.9% (fails)</title></rect><text x="818.2" y="207.8" class="tiny" text-anchor="middle">✗</text><text x="805.0" y="396.0" class="tick" text-anchor="middle">UNPAIRED</text><text x="805.0" y="410.0" class="tiny" text-anchor="middle">4-methylcyclohexanol's</text><rect x="875.4" y="255.0" width="79.2" height="87.5" fill="#1f2328" fill-opacity="0.07"><title>RECIPROCAL: the band rung 9 asks for, 15-50%</title></rect><line x1="875.4" y1="285.0" x2="954.6" y2="285.0" stroke="#1f2328" stroke-dasharray="3 3"><title>flies 38%</title></line><rect x="890.8" y="356.5" width="22.0" height="23.5" fill="#8c959f"><title>set A: 9.4% (fails)</title></rect><text x="901.8" y="351.5" class="tiny" text-anchor="middle">✗</text><rect x="917.2" y="289.0" width="22.0" height="91.0" fill="#b8322a"><title>set C: 36.4% (passes)</title></rect><text x="928.2" y="284.0" class="tiny" text-anchor="middle">✓</text><text x="915.0" y="396.0" class="tick" text-anchor="middle">RECIPROCAL</text><text x="915.0" y="410.0" class="tiny" text-anchor="middle">3-octanol's</text><rect x="985.4" y="342.5" width="79.2" height="37.5" fill="#1f2328" fill-opacity="0.07"><title>BACKWARD: the band rung 9 asks for, 0-15%</title></rect><rect x="1000.8" y="378.2" width="22.0" height="1.8" fill="#8c959f"><title>set A: 0.7% (passes)</title></rect><text x="1011.8" y="373.2" class="tiny" text-anchor="middle">✓</text><rect x="1027.2" y="340.0" width="22.0" height="40.0" fill="#b8322a"><title>set C: 16.0% (fails)</title></rect><text x="1038.2" y="335.0" class="tiny" text-anchor="middle">✗</text><text x="1025.0" y="396.0" class="tick" text-anchor="middle">BACKWARD</text><text x="1025.0" y="410.0" class="tiny" text-anchor="middle">change, dopamine first</text><rect x="640" y="424" width="14" height="12" fill="#8c959f"/><text x="660.0" y="434.0" class="tick" text-anchor="start">set A (learning pilot 12)</text><rect x="810" y="424" width="14" height="12" fill="#b8322a"/><text x="830.0" y="434.0" class="tick" text-anchor="start">set C (learning pilot 13)</text><line x1="980" y1="430" x2="1000" y2="430" stroke="#1f2328" stroke-dasharray="3 3"/><text x="1006.0" y="434.0" class="tick" text-anchor="start">flies</text></svg>