[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "brainfly"
version = "0.1.0"
description = "The fruit fly's whole nervous system, the MaleCNS connectome, as a network you can run: 166,700 neurons, a flyvis optic lobe and a walking body."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Josh Bradley" }]
keywords = ["connectome", "drosophila", "spiking neural network", "neuroscience"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "numba>=0.61",
]

[project.optional-dependencies]
gpu = ["cupy-cuda12x[ctk]>=13"]
build = ["pandas>=2.2", "pyarrow>=15", "openpyxl>=3.1", "rdata>=0.11"]
flyvis = ["flyvis>=1.2"]
body = ["flygym>=2.1"]
test = ["pytest>=8", "brian2>=2.7", "pandas>=2.2", "pyarrow>=15", "openpyxl>=3.1"]

[project.scripts]
brainfly = "brainfly.__main__:main"

[tool.setuptools]
packages = ["brainfly"]

[tool.setuptools.package-data]
brainfly = ["models/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:brian2.*"]
